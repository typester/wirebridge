[package]
name = "wirebridge-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# cdylib is what UniFFI's Kotlin bindings load on the phone; rlib is what the tests link.
[lib]
crate-type = ["rlib", "cdylib"]

# Bindings are generated by a binary in this crate rather than by a separately installed uniffi-bindgen, because the
# two versions have to match exactly and only this one is pinned by Cargo.lock. It sits behind a feature so that clap
# stays out of the dependency graph of the library the phone loads. Same arrangement as beyondmap's crates/core.
[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = { workspace = true }
# Only the Noise/WireGuard state machine (`noise::Tunn`); the `device` feature is a whole TUN-based daemon.
boringtun = { version = "0.7.1", default-features = false }
# The TCP stack: one interface and one socket per TCP connection. Cubic is what the server's sockets use; Reno is
# here for the tests' client, because two smoltcp peers that both run Cubic can stall each other after losing their
# ACKs together (smoltcp #1221, open on 0.14.0).
smoltcp = { version = "0.14.0", default-features = false, features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-tcp-cubic",
    "socket-tcp-reno",
] }
etherparse = "0.21.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
socket2 = "0.6.5"
base64 = "0.23.1"
getrandom = "0.4.3"
thiserror = "2.0.21"
log = "0.4.35"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

[dev-dependencies]
env_logger = "0.11.11"
